name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t bench .
      - name: Selftest passes, and catches mistakes
        run: |
          docker run --rm bench --selftest
          code=0; docker run --rm bench --selftest mistakes || code=$?
          test "$code" = 1
      - name: Publish on a tag, for amd64 and arm64
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push -t "ghcr.io/styri-dev/styri-vda-bench:${GITHUB_REF_NAME}" .
